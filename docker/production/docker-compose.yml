services:
  reverse-proxy:
    image: caddy:2.10-alpine
    container_name: bonsaai-reverse-proxy
    restart: unless-stopped
    ports:
      - "${BONSAAI_HTTP_PORT:-80}:80"
      - "${BONSAAI_HTTPS_PORT:-443}:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.invalid}
      BONSAAI_PUBLIC_HOSTS: ${BONSAAI_PUBLIC_HOSTS:-bonsaai.local}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - bonsaai_caddy_data:/data
      - bonsaai_caddy_config:/config
    depends_on:
      executive-shell:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "caddy",
          "version",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - bonsaai_edge
      - bonsaai_internal
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M

  executive-shell:
    build:
      context: ../..
      dockerfile: docker/production/executive.Dockerfile
    container_name: bonsaai-executive-shell
    restart: unless-stopped
    environment:
      EXECUTIVE_BIND_HOST: 0.0.0.0
      EXECUTIVE_PORT: 8080
      JEBEDIAH_QDRANT_RUNTIME: "1"
      JEBEDIAH_RUNTIME_ROOT: /var/lib/bonsaai/runtime
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      COLLECTION_NAME: ${COLLECTION_NAME:-jebediah_memory}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text:v1.5}
      BONSAAI_WORKSPACE_MODE: ${BONSAAI_WORKSPACE_MODE:-production}
      BONSAAI_DEFAULT_WORKSPACE: ${BONSAAI_DEFAULT_WORKSPACE:-production}
      BONSAAI_ORGANIZATION_ID: ${BONSAAI_ORGANIZATION_ID:-virginia-b-andes}
    volumes:
      - bonsaai_runtime_data:/var/lib/bonsaai/runtime
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - bonsaai_internal
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1536M
        reservations:
          cpus: "0.25"
          memory: 512M

  memory-runtime:
    build:
      context: ../..
      dockerfile: services/jebediah-memory/Dockerfile
    container_name: bonsaai-memory-runtime
    restart: unless-stopped
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      COLLECTION_NAME: ${COLLECTION_NAME:-jebediah_memory}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text:v1.5}
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - bonsaai_internal
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M

  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: bonsaai-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    volumes:
      - bonsaai_qdrant_storage:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6333/healthz', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - bonsaai_internal
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M
        reservations:
          cpus: "0.50"
          memory: 512M

  ollama:
    image: ollama/ollama:0.9.0
    container_name: bonsaai-ollama
    restart: unless-stopped
    volumes:
      - bonsaai_ollama_models:/root/.ollama
    healthcheck:
      test:
        [
          "CMD",
          "ollama",
          "list",
        ]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 90s
    networks:
      - bonsaai_internal
    deploy:
      resources:
        limits:
          cpus: "3.00"
          memory: 4096M
        reservations:
          cpus: "0.50"
          memory: 1024M

networks:
  bonsaai_edge:
    driver: bridge
  bonsaai_internal:
    driver: bridge
    internal: true

volumes:
  bonsaai_caddy_data:
  bonsaai_caddy_config:
  bonsaai_qdrant_storage:
  bonsaai_ollama_models:
  bonsaai_runtime_data:
