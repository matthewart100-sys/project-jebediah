name: Bug report
description: Report reproducible incorrect behavior without sensitive details.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, personal data, private addresses, or
        vulnerability details. Use the security reporting route for suspected
        vulnerabilities.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong, and who or what is affected?
      placeholder: Describe the observed problem and its impact.
    validations:
      required: true
  - type: textarea
    id: current_behavior
    attributes:
      label: Current behavior
      description: What happened? Include sanitized, observable evidence.
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: What contract, requirement, or prior behavior should apply?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the issue.
      placeholder: |
        1. Start from...
        2. Perform...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and evidence category
      description: |
        Identify the relevant version, commit, or component. Separate verified
        facts from reported facts and assumptions.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: |
        Add relevant logs, screenshots, or test output after removing sensitive
        values. Use "Not available" when none exist.
    validations:
      required: true
  - type: dropdown
    id: regression
    attributes:
      label: Regression
      description: Did this behavior work previously?
      options:
        - "Unknown"
        - "Yes"
        - "No"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed secrets, personal data, and private infrastructure details.
          required: true
        - label: This is not a security vulnerability report.
          required: true
