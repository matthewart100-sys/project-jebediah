[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-jebediah-collector"
version = "0.1.0"
description = "Collector 1.0 contract foundation for Project Jebediah"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43,<46",
    "ollama>=0.6,<1.0",
    "pydantic>=2.0,<3.0",
    "qdrant-client>=1.18,<2.0",
]

[dependency-groups]
dev = [
    "fastapi>=0.115,<1.0",
    "pytest>=8.0",
]
service = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.35,<1.0",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/collector",
]
