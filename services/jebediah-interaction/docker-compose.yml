services:
  jebediah-interaction:
    build:
      context: ../..
      dockerfile: services/jebediah-interaction/Dockerfile
    container_name: jebediah-interaction
    restart: unless-stopped
    networks:
      - jebediah_internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MEMORY_URL: ${MEMORY_URL:-http://jebediah-memory:8000}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      GENERATION_MODEL: ${GENERATION_MODEL:-qwen3:8b}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      INTERACTION_STATE_PATH: /var/lib/jebediah-interaction/state.sqlite3
      INTERACTION_STATE_KEY: ${INTERACTION_STATE_KEY:?set INTERACTION_STATE_KEY}
      INTERACTION_SERVICE_TOKEN: ${INTERACTION_SERVICE_TOKEN:?set INTERACTION_SERVICE_TOKEN}
    volumes:
      - interaction_state:/var/lib/jebediah-interaction

networks:
  jebediah_internal:
    external: true
volumes:
  interaction_state:
    name: jebediah_interaction_state
