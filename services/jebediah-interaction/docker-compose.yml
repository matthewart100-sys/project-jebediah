services:
  jebediah-interaction:
    build:
      context: ../..
      dockerfile: services/jebediah-interaction/Dockerfile

    container_name: jebediah-interaction

    restart: unless-stopped

    networks:
      - jebediah_internal
      - jebediah_external

    extra_hosts:
      - "host.docker.internal:100.110.120.15"

    environment:
      MEMORY_URL: http://jebediah-memory:8000
      # Prefer host.docker.internal so containers can reach an Ollama instance
      # running on the (VM) host or Docker Desktop host. Operators may override
      # OLLAMA_URL to a specific host IP if needed.
      OLLAMA_URL: http://host.docker.internal:11434
      GENERATION_MODEL: qwen3:8b

    ports:
      - "8001:8001"

networks:
  jebediah_internal:
    external: true
  jebediah_external:
    external: true
