services:
  jebediah-interaction:
    build:
      context: ../..
      dockerfile: services/jebediah-interaction/Dockerfile

    container_name: jebediah-interaction
    restart: unless-stopped

    expose:
      - "8001"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      MEMORY_URL: "http://jebediah-memory:8000"
      OLLAMA_URL: "http://host.docker.internal:11434"
      GENERATION_MODEL: "qwen3:8b"

      INTERACTION_SERVICE_TOKEN: "${INTERACTION_SERVICE_TOKEN:?set INTERACTION_SERVICE_TOKEN}"

      INTERACTION_STATE_KEY: "${INTERACTION_STATE_KEY:?set INTERACTION_STATE_KEY}"

      INTERACTION_STATE_PATH: "/var/lib/jebediah-interaction/state.sqlite3"

    volumes:
      - jebediah_interaction_state:/var/lib/jebediah-interaction

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - default
      - jebediah-memory-network

networks:
  jebediah-memory-network:
    external: true

volumes:
  jebediah_interaction_state:
