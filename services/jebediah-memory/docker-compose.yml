services:
  jebediah-memory:
    build: .
    container_name: jebediah-memory

    restart: unless-stopped

    networks:
      - jebediah_internal

    extra_hosts:
      - "host.docker.internal:172.20.0.1"

    environment:
      QDRANT_URL: http://qdrant:6333
      COLLECTION_NAME: jebediah_memory
      OLLAMA_URL: http://host.docker.internal:11434
      EMBEDDING_MODEL: nomic-embed-text:latest

networks:
  jebediah_internal:
    external: true
