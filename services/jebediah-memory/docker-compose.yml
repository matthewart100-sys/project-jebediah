services:
  jebediah-memory:
    build:
      context: ../..
      dockerfile: services/jebediah-memory/Dockerfile
    container_name: jebediah-memory

    restart: unless-stopped

    networks:
      - jebediah_internal

    extra_hosts:
      - "host.docker.internal:100.110.120.15"

    environment:
      QDRANT_URL: http://qdrant:6333
      COLLECTION_NAME: jebediah_memory
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      EMBEDDING_MODEL: nomic-embed-text:v1.5

networks:
  jebediah_internal:
    external: true
